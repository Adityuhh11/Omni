# Golden queries for the public corpus in eval/testdata/ (about 20 small files: code and notes).
# `expect`: a hit counts as relevant if its uri contains any of these strings.
# `none: true`: nothing in the corpus answers it, and the engine must not claim a confident match.
# `forbid`: no top-10 hit may contain these (privacy checks).
# Run from sidecar/: uv run python -m omni_memory.eval   (needs OMNI_LLAMA_SERVER and OMNI_MODEL_DIR; see eval/README.md)

# --- code, described in words -----------------------------------------------------------
- query: store a user password safely so a database leak does not expose it
  expect: [password_hash.py]
- query: limit how many requests a client can make per second
  expect: [rate_limiter.go]
- query: try again after a failure and wait longer each time
  expect: [retry_backoff.go]
- query: wait until the user stops typing before running a search
  expect: [debounce.js]
- query: turn a spreadsheet export into JSON
  expect: [csv_to_json.py]
- query: cache that throws away the least recently used entry
  expect: [lru_cache.py]
- query: which places are within a radius of my coordinates
  expect: [haversine.py]
- query: make a title safe to use in a web address
  expect: [slugify.js]
- query: find a number in a sorted list by halving the range
  expect: [binary_search.go]
- query: reject API requests that have no valid login token
  expect: [jwt_verify.js]

# --- code, by identifier ------------------------------------------------------------------
- query: scrypt
  expect: [password_hash.py]
- query: OrderedDict move_to_end
  expect: [lru_cache.py]
- query: sync.Mutex Allow tokens
  expect: [rate_limiter.go]

